<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cadence — merchant view</title>
  <style>
    :root { --bg:#0d1117; --card:#161b22; --line:#30363d; --text:#e6edf3; --dim:#8b949e;
      --green:#3fb950; --amber:#d29922; --red:#f85149; --blue:#58a6ff; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,sans-serif; }
    .wrap { max-width: 920px; margin: 0 auto; padding: 32px 20px 60px; }
    h1 { margin:0 0 2px; font-size:26px; } h1 .c { color:var(--green); }
    .sub { color:var(--dim); margin-bottom:22px; font-size:14px; }
    .cards { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:24px; }
    .stat { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
    .stat .v { font-size:24px; font-weight:700; font-variant-numeric:tabular-nums; }
    .stat .l { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.5px; }
    .stat.rec .v { color:var(--green); } .stat.risk .v { color:var(--amber); }
    table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
    th,td { text-align:left; padding:11px 14px; border-bottom:1px solid var(--line); font-size:14px; }
    th { color:var(--dim); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.5px; }
    tr:last-child td { border-bottom:0; }
    td.num { text-align:right; font-variant-numeric:tabular-nums; }
    .pill { display:inline-block; padding:2px 9px; border-radius:20px; font-size:12px; font-weight:600; }
    .high { background:#4a1214; color:var(--red); } .medium { background:#3a2d05; color:var(--amber); } .low { background:#12331b; color:var(--green); }
    .bar { height:6px; border-radius:4px; background:#21262d; overflow:hidden; width:70px; display:inline-block; vertical-align:middle; }
    .bar > i { display:block; height:100%; }
    .note { color:var(--dim); font-size:12px; margin-top:14px; }
    .nav a { color:var(--blue); text-decoration:none; font-size:13px; } .nav { margin-bottom:18px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="nav"><a href="/demo.html">← recovery demo</a></div>
    <h1><span class="c">Cadence</span> — this fortnight's debit run</h1>
    <div class="sub" id="sub">Loading live model scores…</div>
    <div class="cards" id="cards"></div>
    <table>
      <thead><tr><th>Member</th><th>Amount</th><th>Due</th><th>Dishonour risk</th><th>Cadence action</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="note" id="note"></div>
  </div>
  <script>
    const money = (v) => '$' + Number(v).toLocaleString('en-AU');
    const riskColor = (b) => b === 'high' ? 'var(--red)' : b === 'medium' ? 'var(--amber)' : 'var(--green)';
    fetch('/api/merchant/dashboard').then(r => r.json()).then(d => {
      if (d.error) { document.getElementById('sub').textContent = 'Error: ' + d.error; return; }
      const s = d.summary;
      document.getElementById('sub').textContent =
        `${s.activeMandates} active mandates · Cadence flags the debits likely to fail before the bank run, and re-times them to payday.`;
      document.getElementById('cards').innerHTML = [
        ['', 'This run', money(s.thisRunAud)],
        ['risk', 'At risk', money(s.atRiskAud)],
        ['rec', 'Projected recovered', money(s.projectedRecoveredAud)],
        ['', 'Active mandates', s.activeMandates],
      ].map(([c, l, v]) => `<div class="stat ${c}"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('');
      document.getElementById('rows').innerHTML = d.rows.map(r => `
        <tr>
          <td>${r.payer}</td>
          <td class="num">$${r.amount.toFixed(2)}</td>
          <td>${r.dueDate.slice(5)}</td>
          <td><span class="bar"><i style="width:${Math.round(r.risk*100)}%;background:${riskColor(r.band)}"></i></span>
              <span class="pill ${r.band}">${Math.round(r.risk*100)}%</span></td>
          <td>${r.recommend}</td>
        </tr>`).join('');
      document.getElementById('note').textContent = d.generatedNote;
    }).catch(e => { document.getElementById('sub').textContent = String(e); });
  </script>
</body>
</html>
